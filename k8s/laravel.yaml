apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-new
  template:
    metadata:
      labels:
        app: laravel-new
    spec:
      containers:
        - name: laravel
          image: laravel-k8s-app:latest
          imagePullPolicy: Never
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql-new
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: laravel
            - name: DB_USERNAME
              value: laravel
            - name: DB_PASSWORD
              value: secret
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-new
spec:
  type: NodePort
  selector:
    app: laravel-new
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
